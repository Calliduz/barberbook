version: '3.8'

services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: barberbook-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barberbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barberbook_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-barberbook_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barberbook} -d ${POSTGRES_DB:-barberbook_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    container_name: barberbook-postgres-test
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barberbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barberbook_dev_password}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-barberbook_test}
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barberbook} -d ${TEST_POSTGRES_DB:-barberbook_test}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:

